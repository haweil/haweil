<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Clients call a Laravel REST API that works with Redis, MySQL and third-party integrations">
  <title>How I build backends</title>
  <defs>
    <path id="p1" d="M216 165H384"/>
    <path id="p2" d="M608 165H776"/>
    <path id="p3" d="M496 113V72H776"/>
    <path id="p4" d="M496 217V258H776"/>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d20"/><stop offset="1" stop-color="#b3190f"/></linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;text-anchor:middle;fill:#e6edf7}
    .h{font-size:25px;font-weight:700}.s{font-size:18px;fill:#9fb0cd}.s2{font-size:18px;fill:#ffe1de}
    .box{fill:#141c33;stroke:#33415f;stroke-width:1.5}
    .wire{fill:none;stroke:#3d4e73;stroke-width:2.5;stroke-dasharray:7 7;animation:dash 1.2s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:496px 165px}
    @keyframes dash{to{stroke-dashoffset:-14}}
    @keyframes pulse{50%{transform:scale(1.035)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="330" rx="18" fill="#0b1020"/>
  <use href="#p1" class="wire"/>
  <use href="#p2" class="wire"/>
  <use href="#p3" class="wire"/>
  <use href="#p4" class="wire"/>
  <rect class="box" x="36" y="108" width="180" height="114" rx="14"/>
  <text class="h" x="126" y="156">Clients</text>
  <text class="s" x="126" y="188">Web · Mobile</text>
  <g class="pulse">
    <rect x="384" y="113" width="224" height="104" rx="14" fill="url(#api)"/>
    <text class="h" x="496" y="158">Laravel API</text>
    <text class="s2" x="496" y="188">Auth · Roles · Workflows</text>
  </g>
  <rect class="box" x="776" y="28" width="388" height="88" rx="14"/>
  <text class="h" x="970" y="66">Redis</text>
  <text class="s" x="970" y="96">Caching · Queues</text>
  <rect class="box" x="776" y="121" width="388" height="88" rx="14"/>
  <text class="h" x="970" y="159">MySQL</text>
  <text class="s" x="970" y="189">Database design · Query optimization</text>
  <rect class="box" x="776" y="214" width="388" height="88" rx="14"/>
  <text class="h" x="970" y="252">Integrations</text>
  <text class="s" x="970" y="282">Payments · WhatsApp · Agora</text>
  <circle r="7" fill="#4cc9f0"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="7" fill="#ff8a80"><animateMotion dur="2.4s" begin="-.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p1"/></animateMotion></circle>
  <circle r="7" fill="#4cc9f0"><animateMotion dur="2s" begin="-.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="7" fill="#f7c948"><animateMotion dur="2.8s" begin="-1.1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="7" fill="#7ee787"><animateMotion dur="2.8s" begin="-1.6s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
</svg>
